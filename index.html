<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Messenger Quoc Kietz</title>
    <style>
        body { background: #121212; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; padding-top: 30px; padding-bottom: 30px; margin: 0; }
        .container { background: #1e1e1e; padding: 20px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00e676; margin-top: 0; margin-bottom: 20px; font-size: 22px;}
        
        .tabs { display: flex; border-bottom: 1px solid #333; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: none; border: none; color: #888; padding: 10px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { color: #00e676; border-bottom: 2px solid #00e676; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        label { display: block; margin-top: 15px; font-size: 14px; color: #ccc; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0 10px 0; background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box; font-family: monospace; }
        textarea { resize: vertical; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-blue { background: #00b0ff; color: white; }
        .btn-green { background: #00e676; color: black; margin-top: 20px; }
        .btn-red { background: #ff5252; color: white; display: none; margin-top: 20px; }
        .btn-gray { background: #555; color: white; }
        
        #status { text-align: center; margin-top: 20px; font-size: 14px; color: #00b0ff; font-weight: bold; }
        #box-list { display: none; max-height: 150px; overflow-y: auto; background: #0a0a0a; border: 1px solid #333; border-radius: 5px; margin-bottom: 10px; }
        .box-item { padding: 10px; border-bottom: 1px solid #222; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; }
        .box-item:hover { background: #222; }
        .box-name { color: #fff; font-weight: bold; }
        .box-id { color: #888; }
        #main-app { display: none; }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="login-screen">
            <h2>Tool Messenger Quoc Kietz</h2>
            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu..." onkeypress="handleEnter(event)">
            <button class="btn-green" onclick="login()">ĐĂNG NHẬP</button>
            <div id="login-status" style="text-align: center; margin-top: 15px; color: #ff5252; font-weight: bold;"></div>
        </div>

        <div id="main-app">
            <h2>Tool Messenger Quoc Kietz</h2>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="openTab('tab-spam', this)">TREO TOOL</button>
                <button class="tab-btn" onclick="openTab('tab-info', this)">THÔNG TIN</button>
            </div>

            <div id="tab-spam" class="tab-content active">
                <label>1. Nhập Cookie Facebook (Mỗi dòng 1 acc):</label>
                <textarea id="cookie" rows="5" placeholder="Dán nhiều cookie, cách nhau bằng dấu Enter..."></textarea>
                
                <button class="btn-blue" id="btn-getbox" onclick="getBoxList()">LẤY BOX (TỪ ACC ĐẦU TIÊN)</button>
                <div id="box-list"></div>

                <label>2. Nhập ID Box Messenger:</label>
                <input type="text" id="box_id" placeholder="Nhập ID Box...">

                <label>3. Nội dung tin nhắn:</label>
                <textarea id="message" rows="4" placeholder="Dán nội dung vào đây..."></textarea>

                <label>4. Delay (Giây):</label>
                <input type="number" id="delay" placeholder="VD: 30">

                <button class="btn-green" id="btn-start" onclick="startTool()">BẮT ĐẦU CHẠY NGẦM</button>
                <button class="btn-red" id="btn-stop" onclick="stopTool()">DỪNG TOOL</button>
            </div>

            <div id="tab-info" class="tab-content">
                <p style="text-align: center; margin-top: 30px; line-height: 1.6;">
                    <b>Tool Messenger Quoc Kietz</b><br>
                    Phiên bản: 2.0 Web Server<br>
                    Hỗ trợ Đa Cookie cùng lúc.<br>
                    <i>Lưu ý: Dán mỗi Cookie trên 1 dòng mới.</i>
                </p>
                <button class="btn-gray" onclick="logout()" style="margin-top: 30px;">ĐĂNG XUẤT</button>
            </div>

            <div id="status">Trạng thái: Sẵn sàng</div>
        </div>
    </div>

    <script>
        const protocol = window.location.protocol === "https:" ? "https:" : "http:";
        const API_URL = protocol + "//" + window.location.host + "/api";
        let current_task_id = null;

        function handleEnter(e) { if (e.key === 'Enter') login(); }

        async function login() {
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('login-status');
            statusDiv.innerText = "Đang kiểm tra...";
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if(data.success) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                } else { statusDiv.innerText = "❌ " + data.msg; }
            } catch(e) { statusDiv.innerText = "❌ Lỗi kết nối Server!"; }
        }

        function logout() { location.reload(); }

        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        async function getBoxList() {
            const cookie = document.getElementById('cookie').value.trim();
            if (!cookie) { document.getElementById('status').innerText = "❌ Vui lòng nhập ít nhất 1 Cookie!"; return; }

            document.getElementById('status').innerText = "⏳ Đang lấy danh sách Box...";
            document.getElementById('btn-getbox').innerText = "ĐANG LẤY...";
            document.getElementById('box-list').style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/get_box`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ cookie })
                });
                const data = await res.json();
                
                if(data.success) {
                    document.getElementById('status').innerText = `✅ Lấy thành công ${data.threads.length} Box!`;
                    const listDiv = document.getElementById('box-list');
                    listDiv.innerHTML = '';
                    data.threads.forEach(t => {
                        const item = document.createElement('div');
                        item.className = 'box-item';
                        item.innerHTML = `<span class="box-name">${t.name}</span> <span class="box-id">${t.id}</span>`;
                        item.onclick = () => {
                            document.getElementById('box_id').value = t.id;
                            listDiv.style.display = 'none';
                        };
                        listDiv.appendChild(item);
                    });
                    listDiv.style.display = 'block';
                } else { document.getElementById('status').innerText = "❌ " + data.msg; }
            } catch(e) { document.getElementById('status').innerText = "❌ Lỗi kết nối Server!"; }
            document.getElementById('btn-getbox').innerText = "LẤY BOX (TỪ ACC ĐẦU TIÊN)";
        }

        async function startTool() {
            const cookie = document.getElementById('cookie').value.trim();
            const box_id = document.getElementById('box_id').value.trim();
            const message = document.getElementById('message').value.replace(/\r?\n/g, '\\n'); 
            const delay = document.getElementById('delay').value.trim();

            if (!cookie || !box_id || !message || !delay) {
                document.getElementById('status').innerText = "❌ Vui lòng nhập đầy đủ thông tin!";
                return;
            }

            document.getElementById('status').innerText = "Đang gửi lệnh lên Server...";

            try {
                const res = await fetch(`${API_URL}/start`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ cookie, box_id, message, delay })
                });
                const data = await res.json();
                
                if(data.success) {
                    current_task_id = data.task_id; 
                    document.getElementById('status').innerText = "✅ " + data.msg + ` (Mã: ${data.task_id})`;
                    document.getElementById('btn-start').style.display = 'none';
                    document.getElementById('btn-stop').style.display = 'block';
                } else { document.getElementById('status').innerText = "❌ " + data.msg; }
            } catch(e) { document.getElementById('status').innerText = "❌ Lỗi kết nối Server!"; }
        }

        async function stopTool() {
            if (!current_task_id) {
                document.getElementById('status').innerText = "❌ Không có tiến trình nào đang chạy!";
                return;
            }

            document.getElementById('status').innerText = "Đang dừng...";
            try {
                const res = await fetch(`${API_URL}/stop`, { 
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ task_id: current_task_id })
                });
                const data = await res.json();
                document.getElementById('status').innerText = "🛑 " + data.msg;
                current_task_id = null;
                document.getElementById('btn-start').style.display = 'block';
                document.getElementById('btn-stop').style.display = 'none';
            } catch(e) { document.getElementById('status').innerText = "❌ Lỗi kết nối Server!"; }
        }
    </script>
</body>
</html>
